name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Jest Tests & Coverage
        id: jest
        run: npm run test -- --coverage

      - name: Run Playwright E2E Tests
        id: playwright
        run: npm run test:e2e

      - name: Registrar resultado de pruebas en OpenObserve (RF-03)
        if: always()
        env:
          OO_URL: ${{ secrets.OPENOBSERVE_URL }}
          OO_USER: ${{ secrets.OPENOBSERVE_USER }}
          OO_TOKEN: ${{ secrets.OPENOBSERVE_TOKEN }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          PW_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          if [ "$JEST_OUTCOME" = "success" ] && [ "$PW_OUTCOME" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -sS -f -u "${OO_USER}:${OO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${OO_URL}/ci_cd_events/_json" \
            -d "[{\"evento\":\"ci_tests\",\"estado\":\"${STATUS}\",\"jest\":\"${JEST_OUTCOME}\",\"playwright\":\"${PW_OUTCOME}\",\"commit\":\"${GITHUB_SHA}\",\"rama\":\"${GITHUB_REF_NAME}\",\"usuario\":\"${GITHUB_ACTOR}\",\"timestamp\":\"${TS}\"}]"

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/practica-devops:latest
            ${{ secrets.DOCKER_USERNAME }}/practica-devops:${{ env.sha_short }}

  deploy-to-ec2:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/practica-devops:latest
            sudo docker stop devops-api || true
            sudo docker rm devops-api || true
            sudo docker run -d \
              -p 80:80 -p 6061:6061 \
              --name devops-api \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -e OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318 \
              -e OTEL_SERVICE_NAME=practica-devops-api \
              ${{ secrets.DOCKER_USERNAME }}/practica-devops:latest
            sudo docker image prune -f

      - name: Registrar despliegue exitoso en OpenObserve (RF-03)
        if: success()
        env:
          OO_URL: ${{ secrets.OPENOBSERVE_URL }}
          OO_USER: ${{ secrets.OPENOBSERVE_USER }}
          OO_TOKEN: ${{ secrets.OPENOBSERVE_TOKEN }}
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -sS -f -u "${OO_USER}:${OO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${OO_URL}/ci_cd_events/_json" \
            -d "[{\"evento\":\"deploy_ec2\",\"estado\":\"success\",\"servidor\":\"Servidor-DevOps\",\"commit\":\"${GITHUB_SHA}\",\"rama\":\"${GITHUB_REF_NAME}\",\"usuario\":\"${GITHUB_ACTOR}\",\"timestamp\":\"${TS}\"}]"